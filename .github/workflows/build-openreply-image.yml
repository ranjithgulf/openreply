
name: Build Optimized OpenReply Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build optimized Docker image
        run: |
          docker build \
            -f Dockerfile.optimized \
            -t openreply:optimized \
            .

      - name: Export optimized Docker image
        run: |
          docker save openreply:optimized \
            | gzip -1 > openreply-optimized.tar.gz

      - name: Check optimized image size
        run: |
          echo "=== Optimized Docker image ==="
          docker image inspect openreply:optimized \
            --format 'Image size: {{.Size}} bytes'

          echo "=== Docker disk usage ==="
          docker images openreply:optimized

          echo "=== Compressed archive ==="
          ls -lh openreply-optimized.tar.gz

          echo "=== Uncompressed archive ==="
          gzip -l openreply-optimized.tar.gz

          echo "=== Docker image layers ==="
          docker history openreply:optimized \
            --format 'Size: {{.Size}} | {{.CreatedBy}}' \
            | head -20

      - name: Upload optimized Docker image
        uses: actions/upload-artifact@v4
        with:
          name: openreply-optimized-image
          path: openreply-optimized.tar.gz
          retention-days: 1
          if-no-files-found: error
